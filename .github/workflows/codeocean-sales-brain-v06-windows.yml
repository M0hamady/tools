name: CODEOCEAN Sales Brain v0.6 Windows

on:
  push:
    branches:
      - codeocean-sales-brain-v0.6-desktop
    paths:
      - "codeocean-sales-brain-app/**"
      - ".github/workflows/codeocean-sales-brain-v06-windows.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    defaults:
      run:
        working-directory: codeocean-sales-brain-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        shell: pwsh
        run: npm install --no-audit --no-fund

      - name: Validate desktop app
        shell: pwsh
        run: |
          node --check desktop/main.cjs
          node --check desktop/preload.cjs

      - name: Build Windows installer
        shell: pwsh
        run: npm run dist:installer

      - name: Build Windows portable
        shell: pwsh
        run: npm run dist:portable

      - name: Package release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "..\release" | Out-Null
          Copy-Item "dist-electron\CODEOCEAN-Sales-Brain-Setup-0.6.0.exe" "..\release\" -Force
          Copy-Item "dist-electron\CODEOCEAN-Sales-Brain-Portable-0.6.0.exe" "..\release\" -Force
          Compress-Archive -Path "desktop","index.html","package.json","README.md" -DestinationPath "..\release\CODEOCEAN-Sales-Brain-v0.6-source.zip" -Force
          Get-ChildItem "..\release" | Select-Object Name,Length | Format-Table -AutoSize

      - uses: actions/upload-artifact@v4
        with:
          name: CODEOCEAN-Sales-Brain-v0.6-Windows
          path: release/*
          retention-days: 30
          if-no-files-found: error
